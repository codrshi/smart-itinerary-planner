version: '3.8'

services:
  mongodb:
    image: 'mongo:8.2.2'
    container_name: itix-mongo
    restart: unless-stopped
    hostname: 'localhost'
    ports:
      - "27017:27017"
    volumes:
      - 'mongo_data:/data/db'
    environment:
      - "MONGO_INITDB_DATABASE=smart-itinerary-planner"
    networks:
      - shared-infra
  redis:
    image: 'redis:8.4.0'
    container_name: itix-redis
    restart: unless-stopped
    hostname: 'localhost'
    ports:
      - "6379:6379"
    volumes:
      - 'redis_data:/data'
  minio:
    image: 'quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z'
    container_name: itix-minio
    restart: unless-stopped
    command: server /data --console-address ":9101"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9100:9000"        # S3 API
      - "9101:9101"        # Web console
    volumes:
      - minio_data:/data
    networks:
      - shared-infra
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mongo_data:
  redis_data:
  minio_data:

# shared network between smart-itinerary-planner and smart-itinerary-etl
networks:
  shared-infra:
    name: shared-infra
    driver: bridge