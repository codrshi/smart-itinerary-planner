spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}
    redis:
      url: ${REDIS_URI}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

management:
  endpoint:
    health:
      show-details: WHEN_AUTHORIZED
    env:
      show-values: WHEN_AUTHORIZED
    configprops:
      show-values: WHEN_AUTHORIZED

server:
  forward-headers-strategy: framework

logging:
  level:
    com:
      codrshi:
        smart_itinerary_planner: ${LOGGING_LEVEL:INFO}
    org:
      springframework:
        security: INFO
        web: INFO
        boot: INFO
        data: INFO
        ai: INFO
        aop:
          interceptor:
            AsyncExecutionInterceptor: DEBUG
  pattern:
    console: "%cyan(%d{yyyy-MM-dd HH:mm:ss}) %highlight([%thread]) %highlight(%-5level) %green(%logger{36}) %magenta([%X{X-Trace-Id}]) - %msg%n"

itinerary:
  security:
    require-ssl: true
  async:
    corePoolSize: 5
    maxPoolSize: 15
    queueCapacity: 100
    timeLimitScheduler:
      corePoolSize: 4